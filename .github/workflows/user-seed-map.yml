name: Xbox One Seed Map

on:
  push:
    branches:
      - agent/xbox-one-seed-map
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-map:
    name: Build and generate Xbox One seed map
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with pinned lce submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang-18 cmake ninja-build lld-18

      - name: Configure Seedra library
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_C_COMPILER=clang-18 \
            -DLC_BUILD_EXECUTABLE=OFF

      - name: Build Seedra library
        run: cmake --build build --target LIB_Seedra -j $(nproc)

      - name: Build custom seed runner
        run: |
          clang++-18 -std=c++23 -O2 -mavx2 -msse4.1 -I. -Ilce tools/user_seed_map.cpp build/libLIB_Seedra.a -o build/user_seed_map
          clang++-18 -std=c++23 -O2 -mavx2 -msse4.1 -I. -Ilce tools/dungeon_scan.cpp build/libLIB_Seedra.a -o build/dungeon_scan

      - name: Generate biome map and coordinates
        run: ./build/user_seed_map

      - name: Scan real dungeons near spawn
        run: ./build/dungeon_scan

      - name: List generated files
        run: |
          find seed_output -maxdepth 2 -type f -print -exec ls -lh {} \;
          find dungeon_output -maxdepth 2 -type f -print -exec ls -lh {} \;

      - name: Save latest refresh text back to branch
        run: |
          mkdir -p tools/latest_refresh
          cp seed_output/world_info.txt tools/latest_refresh/world_info.txt
          cp seed_output/structures.csv tools/latest_refresh/structures.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/latest_refresh/world_info.txt tools/latest_refresh/structures.csv
          if ! git diff --cached --quiet; then
            git commit -m "Save latest Seedra refresh results"
            git push
          fi

      - name: Upload generated map and coordinates
        uses: actions/upload-artifact@v4
        with:
          name: xbox-one-seed--5155870644958840792
          path: |
            seed_output/
            dungeon_output/
          if-no-files-found: error
